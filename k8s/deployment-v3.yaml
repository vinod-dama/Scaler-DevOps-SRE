apiVersion: apps/v1
kind: Deployment
metadata: 
  name: devops-sre-app-v3
  namespace: devops-sre
spec: 
  replicas: 2
  selector:
    matchLabels: 
      app: devops-sre-app
      version: v3
  template: 
    metadata:
      labels: 
        app: devops-sre-app
        version: v3
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec: 
      serviceAccountName: devops-sre-sa
      containers:
      - name: app-v3
        image: ghcr.io/vinod-dama/scaler-devops-sre/scaler-devops-sre:v3-45
        imagePullPolicy: Always
        ports: 
        - containerPort: 8080 
        resources: 
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits: 
            memory: "400Mi"
            cpu: "500m"
        envFrom:
        - configMapRef:
            name: devops-sre-cm
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 8080
          periodSeconds: 5
            
