apiVersion: apps/v1
kind: Deployment
metadata:
  name: standalone-grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: standalone-grafana
  template:
    metadata:
      labels:
        app: standalone-grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        volumeMounts:
        - name: dashboard-volume
          mountPath: /var/lib/grafana/dashboards
        - name: provisioning-volume
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
          subPath: dashboards.yaml
      volumes:
      - name: dashboard-volume
        configMap:
          name: sre-app-metrics-dashboard
      - name: provisioning-volume
        configMap:
          name: grafana-provisioning-config

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-config
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: 'file'
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards