apiVersion: apps/v1
kind: Deployment
metadata:
  name: standalone-prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: standalone-prometheus
  template:
    metadata:
      labels:
        app: standalone-prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
        ports:
        - containerPort: 9090
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: standalone-prometheus-svc
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
  selector:
    app: standalone-prometheus