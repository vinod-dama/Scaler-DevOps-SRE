name: CI-Release-to-Registry

on:
  push: 
    branch:
      - develop
  pull_request:
    branch:
       - main

jobs:
   Release-to-Registry:
    runs-on: [ubuntu-latest]
    strategy: 
      matrix:
        version: ["v1", "v2", "v3"]

    steps:
       - name: Checkout Repo Code
         uses: actions/checkout@v4

       - name: Login into GitHub Continer Registry (GHCR)
         uses: docker/login-action@v3
         with: 
           registry: ghcr.io/io
           username: ${{ github.actor }}
           password: ${{ secrets.GITHUB_TOKEN }}

       - name: Extract Metadata (tags, labels) for Docker
         id: meta
         uses: docker/metadata-action@v5
         with: 
           images: ghcr.io/${{ github.repository }}/Scaler-DevOps-SRE
              type=sha, format=long
              type=raw, value=latest,enable={{is_default_branch}}


       - name: Setup Docker Buildx
         uses: docker/setup-buildx-action@v3

       - name: Build and Push Docker image
         uses: docker/build-push-action@v5
         with:
           context: .
           file: ./Dockerfile
           push: true
           images: ghcr.io/${{ github.repository }}/Scaler-DevOps-SRE:${{ matrix.version }}-${{ github.run_number }}}
           tags: ${{ steps.meta.outputs.tags }}
           labels: ${{ steps.meta.outputs.labels }}


           




