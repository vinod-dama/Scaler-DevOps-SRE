name: CI-Release-to-Registry

on:
  push: 
    branch:
      - develop
  pull_request:
    branch:
       - main

jobs:
   Release-to-Registry:
    runs-on: [ubuntu-latest]
    strategy: 
      matrix:
        version: ["v1", "v2", "v3"]

    steps:
       - name: Checkout Repo Code
         uses: actions/checkout@v4

       - name: Login into GitHub Continer Registry (GHCR)
         uses: docker/login-action@v3
         with: 
           registry: ghcr.io
           username: ${{ github.actor }}
           password: ${{ secrets.GITHUB_TOKEN }}

       - name: Extract Metadata (tags, labels) for Docker
         id: meta
         uses: docker/metadata-action@v5
         with: 
           images: ghcr.io/${{ github.repository }}
           tags: |
              type=sha, format=long
              type=raw, value=${{ matrix.version }}-${{ github.run_number }},enable={{is_default_branch}}


       - name: Setup Docker Buildx
         uses: docker/setup-buildx-action@v3

       - name: Build and Push Docker image
         uses: docker/build-push-action@v5
         with:
           context: .
           file: ./Dockerfile
           push: true
           tags: ${{ steps.meta.outputs.tags }}
           labels: ${{ steps.meta.outputs.labels }}

       - name: Update Image Tag in Kubernetes Manifest
         run: |
           # Use sed to update the specific deployment file based on the matrix version
           sed -i 's|scaler-devops-sre:*|scaler-devops-sre:${{ matrix.version }}-${{ github.run_number }}|g' k8s/deployment-${{ matrix.version }}.yaml
          
           # Configure git and push changes back to main branch
           git config --global user.name "GitHub Actions Bot"
           git config --global user.email "actions@github.com"

           git pull
           git add k8s/
           git commit -m "ci: update image tag for ${{ matrix.version }} to ${{ matrix.version }}-${{ github.run_number }} " || echo "No changes to commit"
           git push


           




