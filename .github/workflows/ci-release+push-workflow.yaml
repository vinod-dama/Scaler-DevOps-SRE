name: CI-Release-to-Registry

on:
  push: 
    branches:
      - develop
  pull_request:
    branches:
       - main

jobs:
   Release-to-Registry:
    runs-on: ubuntu-latest
    strategy: 
      matrix:
        version: ["v1", "v2", "v3"]

    steps:
       - name: Checkout Repo Code
         uses: actions/checkout@v4

       - name: Login into GitHub Continer Registry (GHCR)
         uses: docker/login-action@v3
         with: 
           registry: ghcr.io
           username: ${{ github.actor }}
           password: ${{ secrets.GITHUB_TOKEN }}

       - name: Extract Metadata (tags, labels) for Docker
         id: meta
         uses: docker/metadata-action@v5
         with: 
           images: ghcr.io/${{ github.repository }}
           tags: |
              type=sha, format=long
              type=raw, value=${{ matrix.version }}-${{ github.run_number }},enable={{is_default_branch}}


       - name: Setup Docker Buildx
         uses: docker/setup-buildx-action@v3

       - name: Build and Push Docker image
         uses: docker/build-push-action@v5
         with:
           context: .
           file: ./Dockerfile
           push: true
           tags: ${{ steps.meta.outputs.tags }}
           labels: ${{ steps.meta.outputs.labels }}

       - name: Update Image Tag in Kubernetes Manifest
         run: |
           # Use sed to update the specific deployment file based on the matrix version
           for file in k8s/deployment-*.yaml; do
            current_image=$(grep "image:.*scaler-devops-sre:" "$file" | awk '{print $2}')
            echo " current image: $current_image"
            version=$(echo "$current_image" | sed -E 's/.*scaler-devops-sre:([vV][0-9]+)-.*/\1/')
            echo " current image: $current_image"
            echo "Updating image tag versions: $version in file: $file"
            sed -i "s|scaler-devops-sre:${version}-.*|scaler-devops-sre:${version}-${{ github.run_number }}|g" "$file"
           done
          
           # Configure git and push changes back to main branch
           git config --global user.name "GitHub Actions Bot"
           git config --global user.email "actions@github.com"

           git add k8s/
           git commit -m "ci: update image tag for ${{ matrix.version }} to ${{ matrix.version }}-${{ github.run_number }} " || echo "No changes to commit"
           for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin ${{ github.ref_name }} && break
            echo "Push failed, retrying in 3 seconds..."
            sleep 3
           done


           




