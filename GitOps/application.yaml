apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-sre-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/vinod-dama/Scaler-DevOps-SRE.git'
    targetRevision: HEAD
    path: k8s/application
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: devops-sre
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true